<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Architecture of the analysis pipeline</title><desc id="d">A planner controls two lanes. Numbers: SEC company facts, normaliser, scorers, Explainer. Text: latest 10-K, retriever, qualitative agent, Critic. The Critic can send a failed finding back once. A reporter writes the results files that this site reads.</desc>
<rect class="box" x="20" y="14" width="920" height="40" rx="3"/><text x="30" y="39.0">Planner and orchestrator: decides scope, sector class and which tests apply; times and records every step in the trace</text><rect class="box" x="20" y="86" width="150" height="56" rx="3"/><text x="30" y="109">SEC company facts</text><text class="sub" x="30" y="127">XBRL figures, all years</text><rect class="box" x="210" y="86" width="150" height="56" rx="3"/><text x="220" y="109">Normaliser</text><text class="sub" x="220" y="127">one series per measure</text><rect class="box" x="400" y="86" width="170" height="56" rx="3"/><text x="410" y="109">Scorers G1 to G7, B1 to B4</text><text class="sub" x="410" y="127">plain arithmetic, no model</text><rect class="box" x="20" y="196" width="150" height="56" rx="3"/><text x="30" y="219">Latest 10-K</text><text class="sub" x="30" y="237">Items 1, 1A and 7</text><rect class="box" x="210" y="196" width="150" height="56" rx="3"/><text x="220" y="219">Retriever</text><text class="sub" x="220" y="237">keyword search</text><rect class="box agent" x="400" y="196" width="170" height="56" rx="3"/><text x="410" y="219">Qualitative agent</text><text class="sub" x="410" y="237">one loop per Buffett question</text><rect class="box agent" x="610" y="86" width="150" height="56" rx="3"/><text x="620" y="109">Explainer</text><text class="sub" x="620" y="127">one plain line per score</text><rect class="box agent" x="610" y="196" width="150" height="56" rx="3"/><text x="620" y="219">Critic</text><text class="sub" x="620" y="237">rules first, then a model</text><rect class="box" x="800" y="140" width="140" height="56" rx="3"/><text x="810" y="163">Reporter</text><text class="sub" x="810" y="181">checks, publish gate</text><rect class="box" x="20" y="306" width="920" height="40" rx="3"/><text x="30" y="331.0">Results files and recorded trace, one per company, read by this static site (no model runs here)</text><path class="arrow" d="M170 114.0 H210"/><path class="arrow" d="M203 110.0 L210 114.0 L203 118.0"/><path class="arrow" d="M360 114.0 H400"/><path class="arrow" d="M393 110.0 L400 114.0 L393 118.0"/><path class="arrow" d="M570 114.0 H610"/><path class="arrow" d="M603 110.0 L610 114.0 L603 118.0"/><path class="arrow" d="M170 224.0 H210"/><path class="arrow" d="M203 220.0 L210 224.0 L203 228.0"/><path class="arrow" d="M360 224.0 H400"/><path class="arrow" d="M393 220.0 L400 224.0 L393 228.0"/><path class="arrow" d="M570 224.0 H610"/><path class="arrow" d="M603 220.0 L610 224.0 L603 228.0"/><path class="arrow" d="M685.0 142 L685.0 196"/><path class="arrow" d="M681.0 189 L685.0 196 L689.0 189"/><path class="arrow" d="M760 114.0 H870.0 V140"/><path class="arrow" d="M866.0 133 L870.0 140 L874.0 133"/><path class="arrow" d="M760 224.0 H870.0 V196"/><path class="arrow" d="M866.0 203 L870.0 196 L874.0 203"/><path class="arrow" d="M870 196 V306"/><path class="arrow" d="M866 299 L870 306 L874 299"/><path class="arrow" d="M610 235 H585 V268 H485 V252" stroke-dasharray="4 3"/><path class="arrow" d="M481 259 L485 252 L489 259"/><text class="sub" x="500" y="284">Critic sends a failed finding back for one repair</text></svg>
