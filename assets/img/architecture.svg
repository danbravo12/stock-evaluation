<svg class="arch" viewBox="0 0 960 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Architecture of the analysis pipeline</title><desc id="d">A planner controls two lanes. Numbers: SEC company facts, normaliser, scorers, Explainer. Text: latest 10-K, retriever, qualitative agent, Critic. The Critic can send a failed finding back once, by a rationale rewrite or a constrained retry. A reporter writes the results files. Stability runs reword each question twice and run the agent and the Critic again; the evaluation harness compares with human labels. Publish gates and a secret scan stand between the results files and the static site.</desc><style>svg.arch{--a-paper:#FFFFFF;--a-ink:#1D2733;--a-muted:#5B6673;--a-blue:#2F5D8A}@media(prefers-color-scheme:dark){svg.arch{--a-paper:#1B232C;--a-ink:#E4E9EE;--a-muted:#9AA6B3;--a-blue:#8DB4DB}}svg.arch .box{fill:var(--surface,var(--a-paper));stroke:var(--ink,var(--a-ink));stroke-width:1}svg.arch .agent{stroke:var(--blue,var(--a-blue));stroke-width:2}svg.arch .arrow{stroke:var(--ink,var(--a-ink));stroke-width:1.2;fill:none}svg.arch text{fill:var(--ink,var(--a-ink));font:400 13px system-ui,sans-serif}svg.arch .sub{fill:var(--muted,var(--a-muted));font-size:11.5px}</style><rect class="box" x="20" y="14" width="920" height="40" rx="3"/><text x="30" y="38.0">Planner and orchestrator: decides scope, sector class and which tests apply; times and records every step in the trace</text><rect class="box" x="20" y="86" width="150" height="56" rx="3"/><text x="30" y="109">SEC company facts</text><text class="sub" x="30" y="127">XBRL figures, all years</text><rect class="box" x="210" y="86" width="150" height="56" rx="3"/><text x="220" y="109">Normaliser</text><text class="sub" x="220" y="127">one series per measure</text><rect class="box" x="400" y="86" width="170" height="56" rx="3"/><text x="410" y="109">Scorers G1–G7, B1–B4</text><text class="sub" x="410" y="127">plain arithmetic, no model</text><rect class="box agent" x="610" y="86" width="150" height="56" rx="3"/><text x="620" y="109">Explainer</text><text class="sub" x="620" y="127">one plain line per score</text><rect class="box" x="20" y="196" width="150" height="56" rx="3"/><text x="30" y="219">Latest 10-K</text><text class="sub" x="30" y="237">Items 1, 1A and 7</text><rect class="box" x="210" y="196" width="150" height="56" rx="3"/><text x="220" y="219">Retriever</text><text class="sub" x="220" y="237">keyword search</text><rect class="box agent" x="400" y="196" width="170" height="56" rx="3"/><text x="410" y="219">Qualitative agent</text><text class="sub" x="410" y="237">one loop per question</text><rect class="box agent" x="610" y="196" width="150" height="56" rx="3"/><text x="620" y="219">Critic</text><text class="sub" x="620" y="237">rules first, then a model</text><rect class="box" x="800" y="140" width="140" height="56" rx="3"/><text x="810" y="163">Reporter</text><text class="sub" x="810" y="181">checks, publish gate</text><path class="arrow" d="M170 114 H210"/><path class="arrow" d="M203 110 L210 114 L203 118"/><path class="arrow" d="M360 114 H400"/><path class="arrow" d="M393 110 L400 114 L393 118"/><path class="arrow" d="M570 114 H610"/><path class="arrow" d="M603 110 L610 114 L603 118"/><path class="arrow" d="M170 224 H210"/><path class="arrow" d="M203 220 L210 224 L203 228"/><path class="arrow" d="M360 224 H400"/><path class="arrow" d="M393 220 L400 224 L393 228"/><path class="arrow" d="M570 224 H610"/><path class="arrow" d="M603 220 L610 224 L603 228"/><path class="arrow" d="M685 142 L685 196"/><path class="arrow" d="M681 189 L685 196 L689 189"/><path class="arrow" d="M760 114 H870 V140"/><path class="arrow" d="M866 133 L870 140 L874 133"/><path class="arrow" d="M760 224 H870 V196"/><path class="arrow" d="M866 203 L870 196 L874 203"/><path class="arrow" d="M610 235 H585 V268 H485 V252" stroke-dasharray="4 3"/><path class="arrow" d="M481 259 L485 252 L489 259"/><text class="sub" x="500" y="284">One repair per failed item</text><rect class="box" x="400" y="292" width="440" height="50" rx="3"/><text x="410" y="315">Stability runs: each question reworded twice</text><text class="sub" x="410" y="333">agent and Critic rerun; sets the Borderline and Low reliability marks</text><path class="arrow" d="M735 292 L735 252" stroke-dasharray="4 3"/><path class="arrow" d="M731 259 L735 252 L739 259"/><rect class="box" x="20" y="292" width="360" height="50" rx="3"/><text x="30" y="315">Evaluation harness</text><text class="sub" x="30" y="333">human labels, agreement, threshold sensitivity</text><rect class="box" x="20" y="366" width="920" height="36" rx="3"/><text x="30" y="388.0">Results files and recorded trace, one per company, read by the static site (no model runs there)</text><path class="arrow" d="M870 196 V366"/><path class="arrow" d="M866 359 L870 366 L874 359"/><path class="arrow" d="M620 342 L620 366"/><path class="arrow" d="M616 359 L620 366 L624 359"/><path class="arrow" d="M200 342 L200 366" stroke-dasharray="4 3"/><path class="arrow" d="M196 359 L200 366 L204 359"/><rect class="box" x="20" y="424" width="620" height="36" rx="3"/><text x="30" y="446.0">Publish gates, then a secret scan of the site and every commit</text><rect class="box" x="680" y="424" width="260" height="36" rx="3"/><text x="690" y="446.0">Static site (GitHub Pages)</text><path class="arrow" d="M330 402 L330 424"/><path class="arrow" d="M326 417 L330 424 L334 417"/><path class="arrow" d="M640 442 H680"/><path class="arrow" d="M673 438 L680 442 L673 446"/></svg>
